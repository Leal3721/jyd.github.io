<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>护理十大核心制度 · 500单选+500多选</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            padding: 20px 10px 60px;
            font-family: -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;
            background: #f2f5f9;
            color: #22303f;
            line-height: 1.55
        }

        .wrap {
            max-width: 920px;
            margin: 0 auto
        }

        header {
            background: linear-gradient(135deg,#1565c0,#0d47a1);
            color: #fff;
            border-radius: 14px;
            padding: 20px 22px;
            box-shadow: 0 6px 18px rgba(13,71,161,.25)
        }

            header h1 {
                margin: 0 0 6px;
                font-size: 21px
            }

            header p {
                margin: 0;
                font-size: 13px;
                opacity: .92
            }

        .bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 14px 0 20px;
            background: #fff;
            border-radius: 12px;
            padding: 12px 16px;
            box-shadow: 0 2px 8px rgba(20,40,80,.07);
            font-size: 14px
        }

            .bar div {
                flex: 1 1 150px
            }

            .bar b {
                color: #1565c0;
                font-size: 18px
            }

        h2 {
            font-size: 17px;
            margin: 26px 0 12px;
            padding-left: 11px;
            border-left: 5px solid #1565c0;
            color: #0d3d75
        }

        .question {
            background: #fff;
            border-radius: 12px;
            padding: 15px 17px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(20,40,80,.06);
            border: 1px solid #e6ecf4
        }

        .qtitle {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 10px
        }

        .num {
            display: inline-block;
            min-width: 22px;
            height: 22px;
            line-height: 22px;
            text-align: center;
            background: #1565c0;
            color: #fff;
            border-radius: 50%;
            font-size: 12px;
            margin-right: 7px;
            font-weight: 700
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 7px
        }

        .option {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            width: 100%;
            text-align: left;
            cursor: pointer;
            background: #f8fafd;
            border: 1.5px solid #dde5ef;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 14px;
            color: #22303f;
            font-family: inherit;
            transition: .16s
        }

            .option:hover:not(:disabled) {
                border-color: #1565c0;
                background: #eef5ff
            }

            .option:disabled {
                cursor: default
            }

        .label {
            flex: 0 0 22px;
            height: 22px;
            line-height: 22px;
            text-align: center;
            border-radius: 50%;
            background: #dde5ef;
            color: #4a5b6e;
            font-weight: 700;
            font-size: 12px
        }

        .option.selected {
            border-color: #1565c0;
            background: #e3efff
        }

            .option.selected .label {
                background: #1565c0;
                color: #fff
            }

        .option.correct {
            border-color: #2e7d32;
            background: #e8f5e9
        }

            .option.correct .label {
                background: #2e7d32;
                color: #fff
            }

        .option.wrong {
            border-color: #c62828;
            background: #ffebee
        }

            .option.wrong .label {
                background: #c62828;
                color: #fff
            }

        .actions {
            margin-top: 10px
        }

        .submit {
            background: #1565c0;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 8px 20px;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer
        }

            .submit:hover:not(:disabled) {
                background: #0d47a1
            }

            .submit:disabled {
                background: #b0bec5;
                cursor: default
            }

        .feedback {
            margin-top: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13.5px;
            display: none;
            line-height: 1.65
        }

            .feedback.show {
                display: block
            }

            .feedback.ok {
                background: #e8f5e9;
                border-left: 4px solid #2e7d32;
                color: #1b5e20
            }

            .feedback.no {
                background: #ffebee;
                border-left: 4px solid #c62828;
                color: #8e1c1c
            }

            .feedback.warn {
                background: #fff8e1;
                border-left: 4px solid #f9a825;
                color: #7a5b00
            }

        .ref {
            display: block;
            margin-top: 4px;
            font-size: 12.5px;
            color: #4a5b6e
        }

        .reset {
            display: block;
            margin: 28px auto 0;
            background: #455a64;
            color: #fff;
            border: none;
            border-radius: 9px;
            padding: 11px 34px;
            font-size: 15px;
            font-family: inherit;
            cursor: pointer
        }

            .reset:hover {
                background: #2f3e46
            }

        footer {
            text-align: center;
            font-size: 12px;
            color: #8695a8;
            margin-top: 24px
        }
    </style>
</head>

            { sys: '护理文书', page: 33, topic: '书写要求', desc: '护理文书书写应当客观、真实、及时、准确、完整', points: ['客观', '真实', '及时', '准确', '完整'] },
            { sys: '护理文书', page: 33, topic: '书写用语', desc: '护理文书书写应当使用中文和医学术语', points: ['使用中文', '使用医学术语', '简化字按国务院公布的简化字总表规定书写'] },
            { sys: '护理文书', page: 33, topic: '日期时间', desc: '各项记录必须有日期、时间，使用阿拉伯数字书写，日期用公历年，采用24小时制记录，具体到分钟', points: ['必须有日期时间', '使用阿拉伯数字书写', '日期用公历年', '采用24小时制记录', '具体到分钟'] },
            { sys: '护理文书', page: 33, topic: '医护相符', desc: '进行护理文书书写时要求医护相符', points: ['各班记录结束时必须签全名', '各护理文书按要求及时由上级护士或护士长审核签名', '进行护理文书书写时要求医护相符'] },
            { sys: '护理文书', page: 34, topic: '抢救补记', desc: '因抢救危重病人未能及时书写记录时，当班护士应在抢救后6小时内及时据实补记', points: ['抢救后6小时内补记', '据实补记', '各项记录文件应妥善保管'] }
        ];

        /* ========== 工具 ========== */
        const L = i => String.fromCharCode(65 + i);
        const PER_TYPE = 500;
        const K_LEN = K.length;

        function shuffle(arr, seed) {
            const a = arr.slice();
            let s = seed || 1;
            for (let i = a.length - 1; i > 0; i--) {
                s = (s * 9301 + 49297) % 233280;
                const j = Math.floor(s / 233280 * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        /* ========== 生成单选题 ========== */
        function buildSingles() {
            const list = [];
            for (let i = 0; i < PER_TYPE; i++) {
                const ki = i % K_LEN;
                const variant = Math.floor(i / K_LEN);
                const k = K[ki];
                const correctText = k.desc;

                // 干扰项：从其他知识点 desc 中取 3 个，按变体偏移，避免与正确项相同
                const pool = K.filter((_, idx) => idx !== ki).map(x => x.desc);
                const distractors = [];
                let p = (ki + 1 + variant * 7) % K_LEN;
                while (distractors.length < 3) {
                    if (p !== ki) {
                        const t = K[p].desc;
                        if (t !== correctText && !distractors.includes(t)) distractors.push(t);
                    }
                    p = (p + 3) % K_LEN;
                }

                const options = shuffle([correctText, ...distractors], i + 1);
                const answer = options.indexOf(correctText);
                list.push({
                    no: i + 1, type: 'single', topic: k.topic,
                    q: `关于“${k.sys}”中“${k.topic}”的描述，下列正确的是：`,
                    options, answer,
                    ref: `附件第 ${k.page} 页 · ${k.sys} · ${k.topic}`
                });
            }
            return list;
        }

        /* ========== 生成多选题 ========== */
        function buildMultis() {
            const list = [];
            for (let i = 0; i < PER_TYPE; i++) {
                const ki = i % K_LEN;
                const variant = Math.floor(i / K_LEN);
                const k = K[ki];
                const pts = k.points;

                // 正确项数量 2~3，且不超过要点数
                let correctCount = Math.min(2 + (variant % 2), pts.length);
                if (correctCount < 2) correctCount = 2;
                const start = variant % pts.length;
                const correct = [];
                for (let c = 0; c < correctCount; c++) {
                    const idx = (start + c) % pts.length;
                    if (!correct.includes(pts[idx])) correct.push(pts[idx]);
                }
                // 若去重后不足 2 个，补充
                let ci = 0;
                while (correct.length < 2 && ci < pts.length) {
                    if (!correct.includes(pts[ci])) correct.push(pts[ci]);
                    ci++;
                }

                // 干扰项：从其他知识点 points 中取，凑足 5 个选项
                const need = 5 - correct.length;
                const disPool = [];
                K.forEach((x, idx) => {
                    if (idx !== ki) x.points.forEach(t => {
                        if (!pts.includes(t) && !disPool.includes(t)) disPool.push(t);
                    });
                });
                const distractors = [];
                let p = (variant * 11 + ki) % disPool.length;
                while (distractors.length < need && disPool.length) {
                    const t = disPool[p % disPool.length];
                    if (!distractors.includes(t) && !correct.includes(t)) distractors.push(t);
                    p++;
                }
                // 极端情况兜底
                while (distractors.length < need) distractors.push('以上均不是');

                const options = shuffle([...correct, ...distractors], i + 100);
                const answer = [];
                options.forEach((t, idx) => { if (correct.includes(t)) answer.push(idx); });
                answer.sort((a, b) => a - b);

                list.push({
                    no: i + 1, type: 'multi', topic: k.topic,
                    q: `“${k.sys}”中“${k.topic}”包括以下哪些内容？（多选）`,
                    options, answer,
                    ref: `附件第 ${k.page} 页 · ${k.sys} · ${k.topic}`
                });
            }
            return list;
        }

        /* ========== 渲染 ========== */
        const singles = buildSingles();
        const multis = buildMultis();
        const state = { s: new Set(), m: new Set() };

        function renderSingles() {
            const area = document.getElementById('singleArea');
            area.innerHTML = '';
            const frag = document.createDocumentFragment();
            singles.forEach((q, qi) => {
                const box = document.createElement('div');
                box.className = 'question';
                box.dataset.qi = qi;

                const t = document.createElement('div');
                t.className = 'qtitle';
                t.innerHTML = `<span class="num">${q.no}</span>${q.q}`;
                box.appendChild(t);

                const opts = document.createElement('div');
                opts.className = 'options';
                q.options.forEach((text, oi) => {
                    const b = document.createElement('button');
                    b.className = 'option';
                    b.dataset.oi = oi;
                    b.innerHTML = `<span class="label">${L(oi)}</span><span class="text">${text}</span>`;
                    opts.appendChild(b);
                });
                box.appendChild(opts);

                const fb = document.createElement('div');
                fb.className = 'feedback';
                box.appendChild(fb);
                frag.appendChild(box);
            });
            area.appendChild(frag);
        }

        function renderMultis() {
            const area = document.getElementById('multiArea');
            area.innerHTML = '';
            const frag = document.createDocumentFragment();
            multis.forEach((q, qi) => {
                const box = document.createElement('div');
                box.className = 'question';
                box.dataset.qi = qi;

                const t = document.createElement('div');
                t.className = 'qtitle';
                t.innerHTML = `<span class="num">${q.no}</span>${q.q}`;
                box.appendChild(t);

                const opts = document.createElement('div');
                opts.className = 'options';
                q.options.forEach((text, oi) => {
                    const b = document.createElement('button');
                    b.className = 'option';
                    b.dataset.oi = oi;
                    b.innerHTML = `<span class="label">${L(oi)}</span><span class="text">${text}</span>`;
                    opts.appendChild(b);
                });
                box.appendChild(opts);

                const actions = document.createElement('div');
                actions.className = 'actions';
                const btn = document.createElement('button');
                btn.className = 'submit';
                btn.textContent = '提交答案';
                actions.appendChild(btn);
                box.appendChild(actions);

                const fb = document.createElement('div');
                fb.className = 'feedback';
                box.appendChild(fb);
                frag.appendChild(box);
            });
            area.appendChild(frag);
        }

        /* ========== 交互：事件委托 ========== */
        document.getElementById('singleArea').addEventListener('click', e => {
            const btn = e.target.closest('.option');
            if (!btn) return;
            const box = btn.closest('.question');
            if (!box || box.dataset.done === '1') return;
            const qi = +box.dataset.qi;
            const q = singles[qi];
            const chosen = +btn.dataset.oi;
            box.dataset.done = '1';

            const btns = box.querySelectorAll('.option');
            btns.forEach((b, i) => {
                b.disabled = true;
                if (i === q.answer) b.classList.add('correct');
                if (i === chosen && chosen !== q.answer) b.classList.add('wrong');
            });

            const fb = box.querySelector('.feedback');
            if (chosen === q.answer) {
                state.s.add(qi);
                fb.className = 'feedback ok show';
                fb.innerHTML = `✅ 回答正确！正确答案：<b>${L(q.answer)}. ${q.options[q.answer]}</b><span class="ref">依据：${q.ref}</span>`;
            } else {
                fb.className = 'feedback no show';
                fb.innerHTML = `❌ 回答错误。你选择了 <b>${L(chosen)}</b>，正确答案是 <b>${L(q.answer)}. ${q.options[q.answer]}</b><span class="ref">依据：${q.ref}</span>`;
            }
            updateScore();
        });

        document.getElementById('multiArea').addEventListener('click', e => {
            const box = e.target.closest('.question');
            if (!box) return;

            // 点击选项：切换选中（未提交前）
            const opt = e.target.closest('.option');
            if (opt && box.dataset.done !== '1') {
                opt.classList.toggle('selected');
                return;
            }

            // 点击提交
            const submit = e.target.closest('.submit');
            if (!submit || box.dataset.done === '1') return;
            const qi = +box.dataset.qi;
            const q = multis[qi];
            const btns = Array.from(box.querySelectorAll('.option'));
            const chosen = [];
            btns.forEach((b, i) => { if (b.classList.contains('selected')) chosen.push(i); });

            const fb = box.querySelector('.feedback');
            if (chosen.length === 0) {
                fb.className = 'feedback warn show';
                fb.innerHTML = '⚠️ 请至少选择一个选项后再提交。';
                return;
            }

            box.dataset.done = '1';
            submit.disabled = true;
            const correct = q.answer;
            const isRight = chosen.length === correct.length && chosen.every(i => correct.includes(i));

            btns.forEach((b, i) => {
                b.disabled = true;
                b.classList.remove('selected');
                if (correct.includes(i)) b.classList.add('correct');
                else if (chosen.includes(i)) b.classList.add('wrong');
            });

            const correctLetters = correct.map(i => L(i)).join('、');
            const correctText = correct.map(i => q.options[i]).join('；');
            const chosenLetters = chosen.sort((a, b) => a - b).map(i => L(i)).join('、');

            if (isRight) {
                state.m.add(qi);
                fb.className = 'feedback ok show';
                fb.innerHTML = `✅ 回答正确！正确答案：<b>${correctLetters}</b><span class="ref">依据：${q.ref}</span>`;
            } else {
                fb.className = 'feedback no show';
                fb.innerHTML = `❌ 回答错误。你的选择：<b>${chosenLetters}</b><br>正确答案：<b>${correctLetters}</b>（${correctText}）<span class="ref">依据：${q.ref}</span>`;
            }
            updateScore();
        });

        function updateScore() {
            const s = state.s.size, m = state.m.size;
            document.getElementById('score').textContent = s + m;
            document.getElementById('sScore').textContent = s;
            document.getElementById('mScore').textContent = m;
            if (s + m === PER_TYPE * 2) {
                document.querySelector('.bar').style.background = '#e8f5e9';
                document.querySelector('.bar').style.border = '1.5px solid #a5d6a7';
            }
        }

        function init() {
            state.s.clear();
            state.m.clear();
            document.querySelector('.bar').style.background = '#fff';
            document.querySelector('.bar').style.border = 'none';
            renderSingles();
            renderMultis();
            updateScore();
        }

        document.getElementById('resetBtn').addEventListener('click', () => {
            if (confirm('确定清空所有作答记录并重新开始吗？')) {
                init();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });

        init();
    </script>
