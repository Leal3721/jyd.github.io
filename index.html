<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek - 探索无限可能</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --brand: #4d6bfe;
            --brand-hover: #3c59f0;
            --brand-soft: #eef2ff;
            --text: #1a1a1a;
            --text-2: #5c6070;
            --text-3: #9b9fad;
            --line: #e8eaf0;
            --bg: #ffffff;
            --sidebar-bg: #f8f9fc;
            --hover: #eef1f7;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: #d8dbe3;
            border-radius: 3px;
        }

            ::-webkit-scrollbar-thumb:hover {
                background: #c3c7d1;
            }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        /* ============ 布局 ============ */
        .app {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ============ 侧边栏 ============ */
        .sidebar {
            width: 260px;
            flex: 0 0 260px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            transition: margin-left .25s ease, transform .25s ease;
        }

        .app.collapsed .sidebar {
            margin-left: -260px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 18px 16px 10px;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: .3px;
            color: var(--brand);
        }

            .brand svg {
                flex: none;
            }

        .new-chat {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 6px 12px 14px;
            padding: 9px 14px;
            border-radius: 12px;
            border: 1px solid #dde3fb;
            background: #fff;
            color: var(--brand);
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: .18s;
        }

            .new-chat:hover {
                background: var(--brand-soft);
                border-color: #c3cfff;
            }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 8px 12px;
        }

        .group-label {
            font-size: 12px;
            color: var(--text-3);
            padding: 12px 10px 6px;
            letter-spacing: .3px;
        }

        .chat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 10px;
            border-radius: 10px;
            font-size: 13.5px;
            color: var(--text-2);
            cursor: pointer;
            transition: .15s;
        }

            .chat-item span {
                overflow: hidden;
                white-space: nowrap;
                text-overflow: ellipsis;
            }

            .chat-item svg {
                flex: none;
                opacity: .55;
            }

            .chat-item:hover {
                background: var(--hover);
            }

            .chat-item.active {
                background: #e7ecfd;
                color: var(--brand);
            }

                .chat-item.active svg {
                    opacity: 1;
                }

        .sidebar-footer {
            border-top: 1px solid var(--line);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: .15s;
        }

            .sidebar-footer:hover {
                background: var(--hover);
            }

        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4d6bfe, #8ea2ff);
            color: #fff;
            display: grid;
            place-items: center;
            font-size: 13px;
            font-weight: 600;
            flex: none;
        }

        .user-name {
            font-size: 13.5px;
            font-weight: 500;
        }

        .user-sub {
            font-size: 11.5px;
            color: var(--text-3);
            margin-top: 1px;
        }

        /* ============ 主区域 ============ */
        .main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            position: relative;
            background: #fff;
        }

        .topbar {
            height: 56px;
            flex: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
        }

        .topbar-left, .topbar-right {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .icon-btn {
            width: 34px;
            height: 34px;
            border: none;
            background: transparent;
            border-radius: 9px;
            color: var(--text-2);
            display: grid;
            place-items: center;
            cursor: pointer;
            transition: .15s;
        }

            .icon-btn:hover {
                background: var(--hover);
                color: var(--text);
            }

        .model-select {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 6px 10px;
            border-radius: 9px;
            font-size: 14.5px;
            font-weight: 600;
            color: var(--text);
            background: transparent;
            border: none;
            font-family: inherit;
            cursor: pointer;
            transition: .15s;
        }

            .model-select:hover {
                background: var(--hover);
            }

            .model-select .chev {
                color: var(--text-3);
                margin-top: 2px;
            }

        .badge-new {
            font-size: 10px;
            font-weight: 600;
            color: var(--brand);
            background: var(--brand-soft);
            border-radius: 5px;
            padding: 1px 5px;
            margin-left: 2px;
        }

        /* ============ 聊天区 ============ */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            padding: 8px 16px 0;
            scroll-behavior: smooth;
        }

        .welcome {
            margin: auto;
            text-align: center;
            padding-bottom: 30px;
            animation: fadeUp .5s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .welcome-logo {
            width: 58px;
            height: 58px;
            margin: 0 auto 20px;
            border-radius: 16px;
            background: var(--brand-soft);
            display: grid;
            place-items: center;
        }

        .welcome h1 {
            font-size: 27px;
            font-weight: 600;
            letter-spacing: .2px;
            margin-bottom: 12px;
        }

        .welcome p {
            font-size: 14.5px;
            color: var(--text-3);
            line-height: 1.8;
            max-width: 460px;
            margin: 0 auto;
        }

        .prompts {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 30px auto 0;
            max-width: 600px;
        }

        .prompt {
            padding: 10px 15px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #fff;
            font-size: 13.5px;
            color: var(--text-2);
            font-family: inherit;
            cursor: pointer;
            transition: .18s;
        }

            .prompt:hover {
                border-color: #c3cfff;
                color: var(--brand);
                background: var(--brand-soft);
                transform: translateY(-1px);
            }

        /* 消息 */
        .msg {
            width: 100%;
            max-width: 760px;
            margin: 0 auto 22px;
            animation: fadeUp .28s ease;
        }

            .msg.user {
                display: flex;
                justify-content: flex-end;
            }

                .msg.user .bubble {
                    background: #f0f3fa;
                    padding: 11px 16px;
                    border-radius: 16px;
                    max-width: 78%;
                    font-size: 15px;
                    line-height: 1.7;
                    white-space: pre-wrap;
                    word-break: break-word;
                }

            .msg.ai {
                display: flex;
                gap: 12px;
                align-items: flex-start;
            }

                .msg.ai .ai-avatar {
                    width: 28px;
                    height: 28px;
                    flex: none;
                    border-radius: 50%;
                    background: var(--brand-soft);
                    display: grid;
                    place-items: center;
                }

                .msg.ai .content {
                    font-size: 15px;
                    line-height: 1.8;
                    padding-top: 2px;
                    white-space: pre-wrap;
                    word-break: break-word;
                    color: #22242c;
                }

        .typing {
            display: flex;
            gap: 4px;
            padding: 9px 0;
        }

            .typing span {
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: #c3c9d9;
                animation: blink 1.2s infinite;
            }

                .typing span:nth-child(2) {
                    animation-delay: .18s;
                }

                .typing span:nth-child(3) {
                    animation-delay: .36s;
                }

        @keyframes blink {
            0%, 80%, 100% {
                opacity: .3;
                transform: translateY(0);
            }

            40% {
                opacity: 1;
                transform: translateY(-3px);
            }
        }

        /* ============ 输入区 ============ */
        .composer {
            flex: none;
            padding: 6px 16px 14px;
        }

        .composer-inner {
            max-width: 760px;
            margin: 0 auto;
            background: #fff;
            border: 1.5px solid #e2e5ee;
            border-radius: 18px;
            padding: 12px 12px 9px;
            transition: border-color .2s, box-shadow .2s;
            box-shadow: 0 2px 10px rgba(20, 30, 70, .03);
        }

            .composer-inner:focus-within {
                border-color: #b9c6ff;
                box-shadow: 0 0 0 4px rgba(77, 107, 254, .08);
            }

        #input {
            width: 100%;
            border: none;
            outline: none;
            resize: none;
            background: transparent;
            font-family: inherit;
            font-size: 15px;
            line-height: 1.65;
            color: var(--text);
            max-height: 190px;
            min-height: 24px;
            padding: 0 2px;
        }

            #input::placeholder {
                color: #b2b6c2;
            }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-top: 10px;
        }

        .tools {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tool {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: #fff;
            font-family: inherit;
            font-size: 12.5px;
            color: var(--text-2);
            cursor: pointer;
            transition: .18s;
            white-space: nowrap;
        }

            .tool:hover {
                background: var(--hover);
            }

            .tool.on {
                background: var(--brand-soft);
                border-color: #c3cfff;
                color: var(--brand);
                font-weight: 500;
            }

        .send-area {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .attach {
            width: 34px;
            height: 34px;
            border: none;
            background: transparent;
            border-radius: 50%;
            color: var(--text-2);
            display: grid;
            place-items: center;
            cursor: pointer;
            transition: .15s;
        }

            .attach:hover {
                background: var(--hover);
                color: var(--text);
            }

        .send {
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 50%;
            background: var(--brand);
            color: #fff;
            display: grid;
            place-items: center;
            cursor: pointer;
            transition: .18s;
        }

            .send:not(:disabled):hover {
                background: var(--brand-hover);
                transform: scale(1.05);
            }

            .send:disabled {
                background: #e4e6ee;
                cursor: not-allowed;
            }

        .disclaimer {
            text-align: center;
            font-size: 11.5px;
            color: #b2b6c2;
            margin-top: 9px;
        }

        /* ============ 响应式 ============ */
        @media (max-width: 820px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                z-index: 40;
                box-shadow: 4px 0 24px rgba(20, 30, 70, .08);
            }

            .app.collapsed .sidebar {
                margin-left: 0;
                transform: translateX(-100%);
                box-shadow: none;
            }

            .welcome h1 {
                font-size: 22px;
            }

            .welcome p {
                font-size: 13.5px;
                padding: 0 10px;
            }

            .prompts {
                padding: 0 6px;
            }

            .msg.user .bubble {
                max-width: 88%;
            }
        }
    </style>
</head>
<body>

    <div class="app" id="app">

        <!-- ============ 侧边栏 ============ -->
        <aside class="sidebar">
            <div class="brand">
                <svg width="24" height="24" viewBox="0 0 32 32" fill="none">
                    <ellipse cx="17" cy="18" rx="10" ry="7" fill="#4D6BFE" />
                    <path d="M8 18.5c-1.9 0-3.6-1-4.5-2.5 1.7-.4 3-1.6 3.6-3.2 1.2 1.1 2 2.6 2.3 4.2-.4.9-1 1.5-1.4 1.5z" fill="#4D6BFE" />
                    <circle cx="20.2" cy="16.2" r="1.4" fill="#fff" />
                    <path d="M22.5 8.4c0-1.5.8-2.7 2-3.4" stroke="#4D6BFE" stroke-width="2" stroke-linecap="round" />
                </svg>
                <span>DeepSeek</span>
            </div>

            <button class="new-chat" id="newChat">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round">
                    <path d="M12 5v14M5 12h14" />
                </svg>
                <span>新对话</span>
            </button>

            <div class="chat-list" id="chatList">
                <div class="group-label">今天</div>
                <div class="chat-item active">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                    </svg>
                    <span>帮我写一个登录页面</span>
                </div>
                <div class="chat-item">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                    </svg>
                    <span>解释一下 JavaScript 闭包</span>
                </div>

                <div class="group-label">昨天</div>
                <div class="chat-item">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                    </svg>
                    <span>用 Python 读取 Excel 文件</span>
                </div>
                <div class="chat-item">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                    </svg>
                    <span>帮我润色一段产品文案</span>
                </div>

                <div class="group-label">7 天内</div>
                <div class="chat-item">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                    </svg>
                    <span>讲讲量子计算的原理</span>
                </div>
            </div>

            <div class="sidebar-footer">
                <div class="avatar">我</div>
                <div style="flex:1;min-width:0">
                    <div class="user-name">我的账户</div>
                    <div class="user-sub">免费版</div>
                </div>
                <button class="icon-btn" title="设置">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3" />
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.6.68 1.03 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
                    </svg>
                </button>
            </div>
        </aside>

        <!-- ============ 主区域 ============ -->
        <main class="main">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="icon-btn" id="toggleSidebar" title="收起侧边栏">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="16" rx="3" />
                            <path d="M9 4v16" />
                        </svg>
                    </button>
                    <button class="model-select">
                        DeepSeek-V3
                        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m6 9 6 6 6-6" />
                        </svg>
                    </button>
                </div>
                <div class="topbar-right">
                    <button class="icon-btn" title="分享">
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7" />
                            <path d="M12 3v13" />
                            <path d="m8 7 4-4 4 4" />
                        </svg>
                    </button>
                    <button class="icon-btn" title="更多">
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor">
                            <circle cx="5" cy="12" r="1.7" />
                            <circle cx="12" cy="12" r="1.7" />
                            <circle cx="19" cy="12" r="1.7" />
                        </svg>
                    </button>
                </div>
            </header>

            <!-- 聊天内容区 -->
            <div class="chat-area" id="chatArea">
                <div class="welcome" id="welcome">
                    <div class="welcome-logo">
                        <svg width="34" height="34" viewBox="0 0 32 32" fill="none">
                            <ellipse cx="17" cy="18" rx="10" ry="7" fill="#4D6BFE" />
                            <path d="M8 18.5c-1.9 0-3.6-1-4.5-2.5 1.7-.4 3-1.6 3.6-3.2 1.2 1.1 2 2.6 2.3 4.2-.4.9-1 1.5-1.4 1.5z" fill="#4D6BFE" />
                            <circle cx="20.2" cy="16.2" r="1.4" fill="#fff" />
                            <path d="M22.5 8.4c0-1.5.8-2.7 2-3.4" stroke="#4D6BFE" stroke-width="2" stroke-linecap="round" />
                        </svg>
                    </div>
                    <h1>我是 DeepSeek，很高兴见到你！</h1>
                    <p>我可以帮你写代码、读文件、写作各种创意内容，请把你的任务交给我吧~</p>

                    <div class="prompts">
                        <button class="prompt">帮我写一个响应式网页</button>
                        <button class="prompt">解释一下什么是机器学习</button>
                        <button class="prompt">给我一份周末旅行计划</button>
                        <button class="prompt">帮我把这段英文翻译成中文</button>
                    </div>
                </div>
            </div>

            <!-- 输入区 -->
            <div class="composer">
                <div class="composer-inner">
                    <textarea id="input" rows="1" placeholder="给 DeepSeek 发送消息"></textarea>

                    <div class="toolbar">
                        <div class="tools">
                            <button class="tool" id="thinkBtn">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                     stroke-width="1.8" stroke-linejoin="round">
                                    <path d="m12 3 2.2 5.3L19.5 10l-5.3 2.2L12 17.5 9.8 12.2 4.5 10l5.3-1.7z" />
                                </svg>
                                深度思考 (R1)
                            </button>
                            <button class="tool" id="searchBtn">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="9" />
                                    <path d="M3 12h18" />
                                    <path d="M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18z" />
                                </svg>
                                联网搜索
                            </button>
                        </div>

                        <div class="send-area">
                            <button class="attach" title="上传附件">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M21 11.5 12.5 20a5 5 0 0 1-7-7l8-8a3.5 3.5 0 0 1 5 5l-8 8a2 2 0 0 1-3-3l7-7" />
                                </svg>
                            </button>
                            <button class="send" id="sendBtn" disabled title="发送">
                                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                     stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M12 19V5M6 11l6-6 6 6" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
                <p class="disclaimer">内容由 AI 生成，请仔细甄别</p>
            </div>
        </main>
    </div>

    <script>
        const app = document.getElementById('app');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');
        const chatArea = document.getElementById('chatArea');
        const welcome = document.getElementById('welcome');
        const chatList = document.getElementById('chatList');

        const WHALE = `
        <svg width="18" height="18" viewBox="0 0 32 32" fill="none">
          <ellipse cx="17" cy="18" rx="10" ry="7" fill="#4D6BFE"/>
          <path d="M8 18.5c-1.9 0-3.6-1-4.5-2.5 1.7-.4 3-1.6 3.6-3.2 1.2 1.1 2 2.6 2.3 4.2-.4.9-1 1.5-1.4 1.5z" fill="#4D6BFE"/>
          <circle cx="20.2" cy="16.2" r="1.4" fill="#fff"/>
        </svg>`;

        /* ---------- 文本框自适应高度 ---------- */
        function autoGrow() {
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 190) + 'px';
        }

        input.addEventListener('input', () => {
            autoGrow();
            sendBtn.disabled = !input.value.trim();
        });

        input.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                send();
            }
        });

        /* ---------- 滚动到底部 ---------- */
        function scrollBottom() {
            requestAnimationFrame(() => {
                chatArea.scrollTop = chatArea.scrollHeight;
            });
        }

        /* ---------- 添加用户消息 ---------- */
        function addUser(text) {
            const el = document.createElement('div');
            el.className = 'msg user';
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = text;
            el.appendChild(bubble);
            chatArea.appendChild(el);
            scrollBottom();
        }

        /* ---------- 添加“正在输入” ---------- */
        function addTyping() {
            const el = document.createElement('div');
            el.className = 'msg ai';
            el.innerHTML = `
          <div class="ai-avatar">${WHALE}</div>
          <div class="content">
            <div class="typing"><span></span><span></span><span></span></div>
          </div>`;
            chatArea.appendChild(el);
            scrollBottom();
            return el;
        }

        /* ---------- 添加 AI 回复 ---------- */
        function addAI(text) {
            const el = document.createElement('div');
            el.className = 'msg ai';
            el.innerHTML = `<div class="ai-avatar">${WHALE}</div><div class="content"></div>`;
            el.querySelector('.content').textContent = text;
            chatArea.appendChild(el);
            scrollBottom();
        }

        /* ---------- 模拟回复内容 ---------- */
        function generateReply(text) {
            if (/你好|hi|hello|嗨/i.test(text)) {
                return '你好呀！我是 DeepSeek，很高兴见到你 👋\n\n有什么问题都可以问我，比如写代码、翻译、写作、学习答疑，我都会尽力帮你。';
            }
            if (/代码|html|css|js|javascript|python|写个|函数|程序/i.test(text)) {
                return '好的，我来帮你写。下面是一个简单的示例：\n\nfunction greet(name) {\n  return "你好，" + name + "！";\n}\n\nconsole.log(greet("DeepSeek"));\n\n如果你能告诉我具体的技术栈和需求细节，我可以给出更贴合的完整实现。';
            }
            if (/翻译|英文|中文/i.test(text)) {
                return '好的，把需要翻译的内容发给我就行～\n我会尽量保留原文语气，并给出自然流畅的中文表达。';
            }
            return '收到！关于「' + text.slice(0, 20) + (text.length > 20 ? '…' : '') + '」，我来帮你分析一下。\n\n1. 先梳理核心需求，明确目标；\n2. 再拆解成可执行的步骤；\n3. 最后逐条落实并检查结果。\n\n（这是一个静态演示页面，回复内容为模拟生成。）';
        }

        /* ---------- 发送 ---------- */
        function send() {
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            input.style.height = 'auto';
            sendBtn.disabled = true;

            if (welcome) welcome.style.display = 'none';

            addUser(text);
            addToHistory(text);

            const typing = addTyping();
            setTimeout(() => {
                typing.remove();
                addAI(generateReply(text));
            }, 900);
        }

        sendBtn.addEventListener('click', send);

        /* ---------- 新对话加入历史列表 ---------- */
        function addToHistory(text) {
            const first = chatList.querySelector('.chat-item');
            if (first) first.classList.remove('active');

            const item = document.createElement('div');
            item.className = 'chat-item active';
            item.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          <span></span>`;
            item.querySelector('span').textContent =
                text.length > 16 ? text.slice(0, 16) + '…' : text;

            const firstLabel = chatList.querySelector('.group-label');
            firstLabel.insertAdjacentElement('afterend', item);
        }

        /* ---------- 新对话 ---------- */
        document.getElementById('newChat').addEventListener('click', () => {
            chatArea.querySelectorAll('.msg').forEach(m => m.remove());
            if (welcome) welcome.style.display = '';
            chatArea.scrollTop = 0;
            input.value = '';
            input.style.height = 'auto';
            sendBtn.disabled = true;
            input.focus();
        });

        /* ---------- 功能开关 ---------- */
        ['thinkBtn', 'searchBtn'].forEach(id => {
            const btn = document.getElementById(id);
            btn.addEventListener('click', () => btn.classList.toggle('on'));
        });

        /* ---------- 推荐问题点击 ---------- */
        document.querySelectorAll('.prompt').forEach(p => {
            p.addEventListener('click', () => {
                input.value = p.textContent;
                autoGrow();
                sendBtn.disabled = false;
                input.focus();
            });
        });

        /* ---------- 侧边栏折叠 ---------- */
        document.getElementById('toggleSidebar').addEventListener('click', () => {
            app.classList.toggle('collapsed');
        });

        // 小屏默认收起侧边栏
        if (window.innerWidth <= 820) app.classList.add('collapsed');

        /* ---------- 历史会话切换（演示） ---------- */
        chatList.addEventListener('click', e => {
            const item = e.target.closest('.chat-item');
            if (!item) return;
            chatList.querySelectorAll('.chat-item').forEach(i => i.classList.remove('active'));
            item.classList.add('active');
        });

        /* ---------- 初始化 ---------- */
        input.focus();
        autoGrow();
    </script>
</body>
</html>
